<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodeclaw</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260817-ui-refresh" />
  </head>
  <body>
    <section id="auth-screen" class="auth-screen">
      <form id="auth-form" class="auth-panel">
        <div class="brand-mark auth-mark">N</div>
        <h1>Nodeclaw</h1>
        <p id="auth-subtitle">登录后继续你的工作</p>
        <label id="username-field" class="hidden">用户名<input id="auth-username" autocomplete="username" /></label>
        <label id="email-field" class="hidden">邮箱<input id="auth-email" type="email" autocomplete="email" /></label>
        <label>用户名或邮箱<input id="auth-login" autocomplete="username" /></label>
        <label>密码<input id="auth-password" type="password" autocomplete="current-password" /></label>
        <p id="auth-error" class="auth-error hidden"></p>
        <button id="auth-submit" class="primary-action" type="submit">登录</button>
        <button id="auth-switch" class="text-button" type="button">创建账号</button>
      </form>
    </section>

    <div id="app" class="app-shell hidden">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <div class="brand-mark">N</div>
          <div class="brand-copy">
            <div class="brand-name">Nodeclaw</div>
            <div id="brand-status" class="brand-status">checking</div>
          </div>
          <button id="sidebar-toggle-btn" class="sidebar-toggle desktop-only" type="button" title="折叠侧栏" aria-label="折叠侧栏">‹</button>
          <button id="close-sidebar-btn" class="mobile-only sidebar-close" type="button" title="关闭">×</button>
        </div>
        <button id="new-chat-btn" class="new-chat" type="button"><span>+</span><span>新对话</span></button>
        <div class="sidebar-section session-section">
          <div class="section-kicker">会话</div>
          <div id="session-list" class="session-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-kicker">Workspace</div>
          <div class="mini-stat"><span>Agent</span><strong>FastAPI</strong></div>
          <div class="mini-stat"><span>Memory</span><strong id="sidebar-memory">V3</strong></div>
        </div>
        <div class="session-block account-block">
          <strong id="account-name">-</strong>
          <span id="account-email">-</span>
          <button id="logout-btn" class="text-button" type="button">退出登录</button>
          <button id="delete-account-btn" class="text-button danger-text" type="button">删除账号</button>
        </div>
      </aside>

      <main class="chat-shell">
        <header class="topbar">
          <div class="topbar-leading">
            <button id="mobile-sidebar-btn" class="ghost-button mobile-only" type="button" title="会话" aria-label="打开会话侧栏">☰</button>
            <div><h1 id="session-title">Nodeclaw</h1><p>Personal agent workspace</p></div>
          </div>
          <div class="topbar-actions">
            <button id="mobile-console-btn" class="ghost-button mobile-only" type="button">控制台</button>
            <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">API 文档</a>
          </div>
        </header>
        <section id="messages" class="messages"></section>
        <form id="composer" class="composer">
          <textarea id="message-input" rows="1" placeholder="Message Nodeclaw" aria-label="Message"></textarea>
          <button id="send-btn" type="submit" title="发送" aria-label="发送消息">↑</button>
        </form>
      </main>

      <aside id="inspector" class="inspector">
        <button id="console-rail-btn" class="console-rail-button" type="button" aria-label="展开 Console">›</button>
        <div class="inspector-content">
          <header class="inspector-header">
            <div><h2>Console</h2><p id="panel-summary">checking</p></div>
            <div class="inspector-actions">
              <button id="refresh-console-btn" class="icon-button" type="button" title="刷新" aria-label="刷新控制台">↻</button>
              <button id="collapse-console-btn" class="icon-button" type="button" title="折叠" aria-label="折叠控制台">›</button>
            </div>
          </header>
          <nav id="panel-tabs" class="panel-tabs"></nav>
          <div id="panel-alert" class="panel-alert hidden"></div>
          <div id="panel-content" class="panel-section"></div>
        </div>
      </aside>
      <button id="drawer-scrim" class="drawer-scrim" type="button" aria-label="关闭侧栏"></button>
    </div>
    <script src="/assets/app.js?v=20260817-ui-refresh"></script>
  </body>
</html>
